<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="panNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <linearGradient id="panRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#ef233c"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e1dd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#80ed99" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background Box -->
  <rect x="20" y="30" width="460" height="300" rx="16" fill="url(#panNavy)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Red Brand Banner Arc -->
  <path d="M 20 80 Q 250 140 480 80 L 480 30 L 20 30 Z" fill="url(#panRed)"/>
  
  <!-- Brand Name -->
  <text x="50" y="165" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">Panadol</text>
  <text x="260" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffd166">®</text>
  <text x="52" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ef233c">Paracetamol 500mg</text>
  <text x="52" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#caf0f8">Fast Pain &amp; Fever Relief • 10 Blisters x 10 Tablets</text>
  
  <!-- Holographic Security Seal -->
  <rect x="360" y="120" width="85" height="45" rx="6" fill="url(#holo)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="370" y="142" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#001845">HALEON GSK</text>
  <text x="372" y="155" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#03045e">GENUINE SEAL</text>

  <!-- Regulatory & Blister Info -->
  <rect x="40" y="260" width="420" height="50" rx="8" fill="#001233" stroke="#0077b6" stroke-width="1"/>
  <text x="55" y="282" font-family="monospace" font-size="13" font-weight="bold" fill="#00f5d4">NAFDAC Reg. No: 04-0244</text>
  <text x="55" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#90e0ef">Mfg: GlaxoSmithKline Consumer Nig. PLC / Batch: B24801 / Exp: 09/2028</text>
  <circle cx="435" cy="285" r="14" fill="#06d6a0"/>
  <path d="M 429 285 L 433 289 L 441 280" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
