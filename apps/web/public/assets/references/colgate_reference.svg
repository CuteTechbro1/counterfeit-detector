<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <linearGradient id="colRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ba0001"/>
      <stop offset="40%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#ff3333"/>
    </linearGradient>
    <linearGradient id="metallicSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Carton Outer Box -->
  <rect x="20" y="40" width="480" height="200" rx="10" fill="url(#colRed)" stroke="#ffffff" stroke-width="2"/>
  <rect x="20" y="40" width="480" height="200" rx="10" fill="url(#metallicSheen)"/>

  <!-- Logo Shape -->
  <text x="45" y="115" font-family="'Helvetica Neue', Arial, sans-serif" font-size="56" font-style="italic" font-weight="900" fill="#ffffff" letter-spacing="-1">Colgate</text>
  <text x="255" y="90" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">®</text>

  <rect x="45" y="130" width="280" height="30" rx="6" fill="#003566"/>
  <text x="55" y="151" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MAXIMUM CAVITY PROTECTION</text>

  <text x="45" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Great Regular Flavor • 140g • With Calcium &amp; Fluoride</text>

  <!-- Crimp Area Representation -->
  <rect x="370" y="70" width="110" height="140" rx="8" fill="#800f2f" stroke="#ffffff" stroke-width="1.5"/>
  <text x="382" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TUBE CRIMP</text>
  <rect x="410" y="110" width="28" height="14" fill="#000814"/>
  <text x="385" y="145" font-family="monospace" font-size="10" fill="#ffd166">LOT: 4129NG</text>
  <text x="385" y="160" font-family="monospace" font-size="10" fill="#ffd166">EXP: 11/2027</text>
  <text x="380" y="185" font-family="Arial, sans-serif" font-size="9" fill="#90e0ef">Debossed Grid</text>

  <!-- NAFDAC & Legal -->
  <rect x="45" y="200" width="310" height="26" rx="4" fill="#000000" fill-opacity="0.3"/>
  <text x="55" y="217" font-family="monospace" font-size="11" font-weight="bold" fill="#00f5d4">NAFDAC Reg. No: 02-4019</text>
</svg>
