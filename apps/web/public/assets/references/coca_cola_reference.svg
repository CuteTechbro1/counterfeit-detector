<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cokeLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0003"/>
      <stop offset="50%" stop-color="#3d0309"/>
      <stop offset="100%" stop-color="#140002"/>
    </linearGradient>
    <linearGradient id="cokeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f40009"/>
      <stop offset="100%" stop-color="#ba0006"/>
    </linearGradient>
  </defs>

  <!-- Cap and Tamper Ring -->
  <rect x="130" y="20" width="60" height="35" rx="5" fill="#f40009" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="127" y="55" width="66" height="10" rx="3" fill="#d90429"/>
  <!-- Unbroken Bridges -->
  <line x1="135" y1="52" x2="135" y2="58" stroke="#ffffff" stroke-width="2"/>
  <line x1="160" y1="52" x2="160" y2="58" stroke="#ffffff" stroke-width="2"/>
  <line x1="185" y1="52" x2="185" y2="58" stroke="#ffffff" stroke-width="2"/>

  <!-- Bottle Neck -->
  <path d="M 135 65 L 120 120 Q 90 170 85 240 L 85 440 Q 85 470 120 470 L 200 470 Q 235 470 235 440 L 235 240 Q 230 170 200 120 L 185 65 Z" fill="url(#cokeLiquid)" stroke="#90e0ef" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Laser Neck Etching (Authentic) -->
  <text x="105" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#ffd166" letter-spacing="2">NBC-B24 10:45</text>
  <text x="105" y="160" font-family="monospace" font-size="9" font-weight="bold" fill="#ffd166" letter-spacing="1">EXP 12/26 01-0138</text>

  <!-- Red Label Wrap -->
  <rect x="85" y="240" width="150" height="130" fill="url(#cokeRed)"/>
  <!-- White Dynamic Ribbon Wave -->
  <path d="M 85 305 Q 160 345 235 300 L 235 315 Q 160 360 85 320 Z" fill="#ffffff"/>
  <!-- Script Logo -->
  <text x="96" y="288" font-family="'Brush Script MT', cursive, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" font-style="italic">Coca-Cola</text>
  <text x="105" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">ORIGINAL TASTE • 50cl</text>

  <!-- NAFDAC & Recycled Badge -->
  <rect x="95" y="380" width="130" height="30" rx="4" fill="#000000" fill-opacity="0.4"/>
  <text x="100" y="398" font-family="monospace" font-size="9" fill="#00f5d4">NAFDAC: 01-0138</text>
</svg>
