<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <!-- Counterfeit Panadol sample simulation -->
  <defs>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="500" height="360" fill="#f8f9fa"/>
  <!-- Slightly misaligned and washed out navy background -->
  <rect x="25" y="30" width="450" height="300" rx="12" fill="#1d3557" stroke="#e63946" stroke-width="2"/>
  <path d="M 25 75 Q 230 155 475 75 L 475 30 L 25 30 Z" fill="#b7094c"/>
  
  <!-- Distorted font kerning and blur -->
  <text x="50" y="160" font-family="'Courier New', monospace" font-size="48" font-weight="900" fill="#e0e1dd" filter="url(#blurFilter)">P a n a d o l</text>
  <text x="52" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f26a8d">Paracetamol 500mg</text>
  
  <!-- Missing/Peeling Seal -->
  <rect x="350" y="115" width="90" height="45" rx="6" fill="#adb5bd" stroke="#ffb703" stroke-dasharray="4 2" stroke-width="1.5"/>
  <text x="362" y="142" font-family="Arial, sans-serif" font-size="9" fill="#212529">[SEAL DEFECT]</text>

  <!-- Falsified NAFDAC Reg No -->
  <rect x="45" y="255" width="410" height="50" rx="6" fill="#03071e"/>
  <text x="60" y="285" font-family="monospace" font-size="14" font-weight="bold" fill="#ff4d6d">NAFDAC Reg. No: 04-9988</text>
</svg>
