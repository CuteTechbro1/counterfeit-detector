<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="100%" height="100%">
  <!-- Authentic Coke Photo Simulation -->
  <rect width="320" height="500" fill="#f8f9fa"/>
  <rect x="130" y="20" width="60" height="35" rx="5" fill="#f40009"/>
  <rect x="127" y="55" width="66" height="10" rx="3" fill="#d90429"/>
  <!-- Unbroken seal lines -->
  <line x1="140" y1="52" x2="140" y2="58" stroke="#ffffff" stroke-width="2"/>
  <line x1="180" y1="52" x2="180" y2="58" stroke="#ffffff" stroke-width="2"/>

  <!-- Bottle Body -->
  <path d="M 135 65 L 120 120 Q 90 170 85 240 L 85 440 Q 85 470 120 470 L 200 470 Q 235 470 235 440 L 235 240 Q 230 170 200 120 L 185 65 Z" fill="#2b0004"/>

  <!-- Laser Neck Stamp -->
  <text x="105" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#ffd166">NBC-B24 10:45</text>
  <text x="105" y="160" font-family="monospace" font-size="9" font-weight="bold" fill="#ffd166">EXP 12/26 01-0138</text>

  <!-- Label -->
  <rect x="85" y="240" width="150" height="130" fill="#f40009"/>
  <path d="M 85 305 Q 160 345 235 300 L 235 315 Q 160 360 85 320 Z" fill="#ffffff"/>
  <text x="96" y="288" font-family="'Brush Script MT', cursive, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Coca-Cola</text>
  <text x="105" y="345" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">ORIGINAL TASTE</text>
</svg>
