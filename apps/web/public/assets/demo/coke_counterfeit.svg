<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="100%" height="100%">
  <!-- Counterfeit / Refilled Coke Photo Simulation -->
  <rect width="320" height="500" fill="#f8f9fa"/>
  <!-- Crooked cap with severed drop ring -->
  <rect x="130" y="20" width="60" height="35" rx="5" fill="#c1121f" transform="rotate(-3 160 37)"/>
  <!-- Broken Ring drooping -->
  <rect x="127" y="60" width="66" height="8" rx="2" fill="#780000" transform="rotate(4 160 64)"/>

  <!-- Bottle Body with low/uneven fill line -->
  <path d="M 135 65 L 120 120 Q 90 170 85 240 L 85 440 Q 85 470 120 470 L 200 470 Q 235 470 235 440 L 235 240 Q 230 170 200 120 L 185 65 Z" fill="#38040e"/>

  <!-- MISSING LASER CODE INDICATOR -->
  <rect x="100" y="140" width="120" height="30" rx="4" fill="#ffccd5" stroke="#c9184a" stroke-dasharray="3 3"/>
  <text x="108" y="158" font-family="monospace" font-size="8" fill="#a4133c">[NO LASER CODE]</text>

  <!-- Bubbled Label -->
  <rect x="85" y="240" width="150" height="130" fill="#d90429" stroke="#ffb703" stroke-width="2"/>
  <circle cx="110" cy="260" r="6" fill="#ffb703" fill-opacity="0.4"/>
  <circle cx="210" cy="340" r="8" fill="#ffb703" fill-opacity="0.4"/>
  <text x="96" y="288" font-family="'Brush Script MT', cursive, sans-serif" font-size="33" fill="#ffffff">Coca-Cola</text>
  <text x="105" y="345" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">ORIGINAL TASTE</text>
</svg>
